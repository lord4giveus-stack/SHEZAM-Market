<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة شزام ماركت</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5fa;color:#111827;font-family:Tahoma,Arial,sans-serif}header{background:#111827;color:white;padding:20px;text-align:center;border-bottom:5px solid #e9364b}main{max-width:780px;margin:25px auto;padding:15px}.box{background:white;border-radius:15px;padding:22px;margin-bottom:20px;box-shadow:0 4px 15px #0001}input,select{display:block;width:100%;padding:13px;border:1px solid #ccd2dd;border-radius:9px;margin:10px 0;font:inherit}button{border:0;border-radius:9px;padding:12px 18px;background:#2378ef;color:white;cursor:pointer;font-weight:bold;margin:4px}.danger{background:#e9364b}.hidden{display:none}.item{border-bottom:1px solid #ddd;padding:12px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.note{color:#596478;font-size:13px}#msg{color:#a52d3d;white-space:pre-wrap}a{color:#2378ef}
</style></head><body><header><h1>⚡ إدارة شزام ماركت</h1></header><main><section class="box" id="loginBox"><h2>دخول المدير</h2><form id="loginForm"><input id="email" type="email" placeholder="البريد الإلكتروني" required autocomplete="username"><input id="password" type="password" placeholder="كلمة المرور" required autocomplete="current-password"><button>تسجيل الدخول</button></form><p class="note">لا تضع كلمة المرور داخل ملفات الموقع. يجب أن يكون حسابك معتمداً في قواعد Firestore.</p></section><section id="dashboard" class="hidden"><div class="box"><button id="logout" class="danger">تسجيل الخروج</button><a href="index.html">عرض المتجر ←</a><p id="identity"></p></div><div class="box"><h2 id="formTitle">إضافة منتج</h2><form id="productForm"><input id="name" placeholder="اسم المنتج" required maxlength="120"><input id="category" placeholder="القسم (مثال: مشروبات)" required maxlength="80"><input id="price" type="number" min="0" step="1" placeholder="السعر بالجنيه السوداني" required><input id="imageUrl" type="url" placeholder="رابط صورة المنتج https://... (اختياري)"><label><input id="active" type="checkbox" checked style="width:auto;display:inline"> إظهار المنتج للعملاء</label><button type="submit">حفظ المنتج</button><button type="button" id="resetForm" class="danger">إلغاء التعديل</button></form></div><div class="box"><h2>المنتجات</h2><div id="items">جارٍ التحميل...</div></div></section><p id="msg" role="status"></p></main><script type="module">
import {auth,db} from './firebase.js';
import {onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {collection,onSnapshot,addDoc,doc,updateDoc,deleteDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const $=id=>document.getElementById(id);let editing=null,products=[],unsubscribe=null;
const msg=s=>$('msg').textContent=s;
$('loginForm').onsubmit=async e=>{e.preventDefault();msg('جارٍ تسجيل الدخول...');try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value);$('password').value='';msg('')}catch(err){msg('فشل تسجيل الدخول. تأكد من البريد وكلمة المرور وطريقة Email/Password. '+err.code)}};
$('logout').onclick=()=>signOut(auth);function reset(){editing=null;$('productForm').reset();$('active').checked=true;$('formTitle').textContent='إضافة منتج'}$('resetForm').onclick=reset;
$('productForm').onsubmit=async e=>{e.preventDefault();const price=Number($('price').value);if(!Number.isFinite(price)||price<0){msg('السعر غير صالح');return}const imageUrl=$('imageUrl').value.trim();if(imageUrl&&!/^https:\/\//i.test(imageUrl)){msg('استخدم رابط صورة يبدأ بـ https://');return}const data={name:$('name').value.trim(),category:$('category').value.trim(),price,imageUrl,active:$('active').checked};if(!data.name||!data.category)return;msg('جارٍ الحفظ...');try{if(editing)await updateDoc(doc(db,'products',editing),data);else await addDoc(collection(db,'products'),{...data,createdAt:serverTimestamp()});reset();msg('تم حفظ المنتج بنجاح')}catch(err){msg('تعذر الحفظ. تأكد من صلاحيات المدير في Firestore: '+err.code)}};
function render(){const box=$('items');box.replaceChildren();if(!products.length){box.textContent='لا توجد منتجات بعد';return}for(const p of products){const row=document.createElement('div');row.className='item';const label=document.createElement('span');label.textContent=`${p.name} — ${Number(p.price).toLocaleString('ar-SD')} ج.س (${p.category}) ${p.active?'':'[مخفي]'}`;const actions=document.createElement('span');const edit=document.createElement('button');edit.textContent='تعديل';edit.onclick=()=>{editing=p.id;for(const k of ['name','category','price','imageUrl'])$(k).value=p[k]??'';$('active').checked=!!p.active;$('formTitle').textContent='تعديل منتج';window.scrollTo({top:0,behavior:'smooth'})};const del=document.createElement('button');del.className='danger';del.textContent='حذف';del.onclick=async()=>{if(!confirm('هل تريد حذف المنتج؟'))return;try{await deleteDoc(doc(db,'products',p.id));msg('تم الحذف')}catch(err){msg('تعذر الحذف: '+err.code)}};actions.append(edit,del);row.append(label,actions);box.append(row)}}
onAuthStateChanged(auth,user=>{if(unsubscribe){unsubscribe();unsubscribe=null}reset();$('loginBox').classList.toggle('hidden',!!user);$('dashboard').classList.toggle('hidden',!user);if(!user)return;$('identity').textContent='المستخدم: '+user.email+' | UID: '+user.uid;unsubscribe=onSnapshot(collection(db,'products'),snap=>{products=snap.docs.map(d=>({id:d.id,...d.data()}));render()},err=>msg('لا توجد صلاحية لقراءة المنتجات. تأكد من UID وقواعد Firestore: '+err.code))});
</script></body></html>
